name: CI / CD

on:
  push:
    branches:
      - main  # Production deployment
  workflow_dispatch:  # Manual trigger for any branch

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      FRONTEND_API_BASE_URL: ${{ secrets.FRONTEND_API_BASE_URL != '' && secrets.FRONTEND_API_BASE_URL || 'http://localhost:33221/api' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare lowercase owner
        id: vars
        run: echo "owner_lower=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner_lower }}/stolovaya-backend:latest
            ghcr.io/${{ steps.vars.outputs.owner_lower }}/stolovaya-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ env.FRONTEND_API_BASE_URL }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner_lower }}/stolovaya-frontend:latest
            ghcr.io/${{ steps.vars.outputs.owner_lower }}/stolovaya-frontend:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production
    env:
      VPS_PORT: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.VPS_APP_PATH }}
      GHCR_USER: ${{ github.repository_owner }}
      STACK_VERSION: ${{ github.sha }}
    steps:
      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ env.VPS_PORT }}
          envs: GHCR_USER,STACK_VERSION,DEPLOY_PATH
          script: |
            docker login ghcr.io -u "$GHCR_USER" -p "${{ secrets.GHCR_TOKEN }}"
            cd "$DEPLOY_PATH"
            STACK_VERSION=$STACK_VERSION docker compose -f docker-compose.server.yml pull
            STACK_VERSION=$STACK_VERSION docker compose -f docker-compose.server.yml up -d --remove-orphans
            STACK_VERSION=$STACK_VERSION docker compose -f docker-compose.server.yml ps
            docker image prune -f
