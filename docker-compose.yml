version: "3.9"

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
    depends_on:
      - mongo
    environment:
      PORT: ${BACKEND_PORT:-5000}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/stolovayaGAU}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      NODE_ENV: ${NODE_ENV:-production}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-dummy}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-dummy}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-bucket}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://storage.yandexcloud.net}
      S3_REGION: ${S3_REGION:-ru-central1}
    ports:
      - "${BACKEND_PORT:-5000}:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:5000/api}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-4173}:80"

volumes:
  mongo-data:
