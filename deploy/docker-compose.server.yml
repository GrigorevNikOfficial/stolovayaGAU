version: "3.9"

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    networks:
      - stolovaya
    volumes:
      - mongo-data:/data/db

  mongo-express:
    image: mongo-express:1.0.2
    restart: unless-stopped
    networks:
      - stolovaya
    ports:
      - "127.0.0.1:${MONGO_EXPRESS_PORT:-34817}:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:?set MONGO_EXPRESS_PASSWORD in .env}
    depends_on:
      - mongo

  backend:
    image: ghcr.io/grigorevnikofficial/stolovaya-backend:${STACK_VERSION:-latest}
    restart: unless-stopped
    networks:
      - stolovaya
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      PORT: ${BACKEND_PORT:-33221}
    ports:
      - "${BACKEND_PORT:-33221}:33221"

  frontend:
    image: ghcr.io/grigorevnikofficial/stolovaya-frontend:${STACK_VERSION:-latest}
    restart: unless-stopped
    networks:
      - stolovaya
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-33321}:80"

networks:
  stolovaya:
    name: stolovaya

volumes:
  mongo-data:
